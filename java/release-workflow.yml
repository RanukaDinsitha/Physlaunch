name: Cross-platform release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: .\build.ps1
          - os: macos-latest
            build: bash ./build.sh
          - os: ubuntu-latest
            build: bash ./build.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build self-contained applications
        shell: pwsh
        if: runner.os == 'Windows'
        working-directory: java
        run: ${{ matrix.build }}
      - name: Build self-contained applications
        if: runner.os != 'Windows'
        working-directory: java
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: Physlaunch-${{ runner.os }}-${{ runner.arch }}
          path: java/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
